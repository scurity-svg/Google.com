<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captured Data</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f5f5f5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{max-width:460px;width:100%;background:#fff;border-radius:40px;padding:30px 22px;border:1px solid rgba(0,0,0,0.03)}
.header{text-align:center;margin-bottom:22px}
.header .icon{font-size:48px;display:block}
.header h2{font-weight:400;color:#cc0000}
.log-box{background:#f8f8f8;border-radius:16px;padding:16px;max-height:400px;overflow-y:auto;font-family:'Courier New',monospace;font-size:12px;color:#1a1a1a;white-space:pre-wrap;word-break:break-all;border:1px solid #eee}
.log-box .entry{border-bottom:1px solid #eee;padding:8px 0}
.empty-log{color:#aaa;text-align:center;padding:20px 0}
.clear-btn{background:#cc0000;color:#fff;border:none;padding:12px;border-radius:16px;width:100%;font-weight:600;cursor:pointer;margin-top:12px}
.clear-btn:hover{background:#aa0000}
.back-btn{display:block;margin-top:18px;text-align:center;color:#888;text-decoration:none;font-size:14px}
.back-btn:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<div class="header"><span class="icon">📊</span><h2>Captured Data</h2></div>
<div id="logContainer" class="log-box"><div class="empty-log">No data captured yet.</div></div>
<button onclick="clearLogs()" class="clear-btn">🗑 Clear All Data</button>
<a href="index.html" class="back-btn">← Back</a>
</div>
<script>
const STORAGE_KEY='phish_data';
function getLogs(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];}}
function renderLogs(){const container=document.getElementById('logContainer');const logs=getLogs();if(logs.length===0){container.innerHTML='<div class="empty-log">No data captured yet.</div>';return;}container.innerHTML=logs.map(entry=>'<div class="entry">'+escapeHtml(entry)+'</div>').join('');}
function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML;}
function clearLogs(){if(confirm('Hapus semua data?')){localStorage.removeItem(STORAGE_KEY);renderLogs();}}
document.addEventListener('DOMContentLoaded',renderLogs);
</script>
</body>
</html>
